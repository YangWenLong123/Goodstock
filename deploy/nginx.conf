# 宝塔 IP 站点的 HTTP 配置，访问地址：http://124.223.60.74。
server {
    listen 80;
    server_name 124.223.60.74;
    root /www/wwwroot/124.223.60.74/frontend/dist;
    index index.html;

    access_log /www/wwwlogs/goodstock-access.log;
    error_log /www/wwwlogs/goodstock-error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /api/ {
        # 保留 /api 前缀，proxy_pass 后不要追加 /。
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
    }

    # Swagger 页面、OAuth 回调以及 OpenAPI 描述。
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://127.0.0.1:8001;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
